<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email - MoralVerse.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/professional.css">
  <style>
    .otp-input {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 10px;
      font-family: 'Courier New', monospace;
    }
    .resend-btn {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0;
    }
    .resend-btn:hover  { color: var(--primary-dark); }
    .resend-btn:disabled { color: var(--text-muted); cursor: not-allowed; text-decoration: none; }
  </style>
</head>
<body class="page-enter" style="background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; padding: 1.5rem 0;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card-pro text-center">

          <!-- Brand -->
          <div class="navbar-brand-pro mb-1" style="font-size:1.75rem;">
            <i class="bi bi-stars me-1"></i>MoralVerse.AI
          </div>
          <p class="text-muted-pro text-small mb-4">AI-Powered Interactive Storytelling</p>

          <!-- Icon -->
          <div class="mb-3" style="font-size:3rem; color:var(--primary);">
            <i class="bi bi-envelope-check-fill"></i>
          </div>
          <h2 class="mb-1" style="font-size:1.4rem;">Verify Your Email</h2>
          <p class="text-muted-pro text-small mb-4">Enter the 6-digit code sent to your email</p>

          <!-- Messages -->
          {% if messages %}
            {% for message in messages %}
              <div class="alert-pro alert-pro--{{ message.tags }} text-start mb-3">
                <i class="alert-icon bi
                  {% if message.tags == 'success' %}bi-check-circle-fill
                  {% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-circle-fill
                  {% else %}bi-info-circle-fill{% endif %}"></i>
                <div class="alert-body">{{ message }}</div>
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <div class="mb-3 text-start">
              <label class="label-pro" for="email">
                <i class="bi bi-envelope me-1"></i>Email Address
              </label>
              <input type="email" id="email" name="email" required
                     class="input-pro" placeholder="Enter your email address">
            </div>

            <div class="mb-4 text-start">
              <label class="label-pro" for="otp">
                <i class="bi bi-shield-lock me-1"></i>Verification Code
              </label>
              <input type="text" id="otp" name="otp" required
                     class="input-pro otp-input"
                     placeholder="000000" maxlength="6"
                     pattern="[0-9]{6}" title="Enter 6-digit code"
                     inputmode="numeric" autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn btn-pro w-100 mb-3">
              <i class="bi bi-check-lg me-2"></i>Verify Email
            </button>
          </form>

          <!-- Resend -->
          <div class="pt-3 mt-1" style="border-top:1px solid var(--border);">
            <p class="text-muted-pro text-small mb-2">Didn't receive the code?</p>
            <button type="button" class="resend-btn" id="resend-btn" onclick="resendOTP()">
              <i class="bi bi-arrow-clockwise me-1"></i>Resend verification code
            </button>
          </div>

          <!-- Links -->
          <div class="mt-3 text-small">
            <a href="{% url 'signup' %}" class="text-decoration-none me-3">
              <i class="bi bi-arrow-left me-1"></i>Back to Sign Up
            </a>
            <a href="{% url 'login' %}" class="text-decoration-none">Already have an account?</a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="theme-switcher">
    <button class="theme-toggle-btn" id="theme-toggle-btn" type="button">
      <i class="bi bi-palette me-1"></i>Theme
    </button>
    <div class="theme-panel" id="theme-panel" style="display:none;">
      <button class="theme-option" data-theme="light"  type="button"><i class="bi bi-sun me-2"></i>Light</button>
      <button class="theme-option" data-theme="dark"   type="button"><i class="bi bi-moon me-2"></i>Dark</button>
      <button class="theme-option" data-theme="ocean"  type="button"><i class="bi bi-water me-2"></i>Ocean</button>
      <button class="theme-option" data-theme="sunset" type="button"><i class="bi bi-sunset me-2"></i>Sunset</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Theme
    (function () {
      const root = document.documentElement;
      const saved = localStorage.getItem("mv_theme") || "light";
      const panel = document.getElementById("theme-panel");
      const toggle = document.getElementById("theme-toggle-btn");
      const options = document.querySelectorAll(".theme-option");
      function applyTheme(t) {
        root.setAttribute("data-theme", t);
        localStorage.setItem("mv_theme", t);
        options.forEach(b => b.classList.toggle("active", b.dataset.theme === t));
      }
      applyTheme(saved);
      toggle.addEventListener("click", () => { panel.style.display = panel.style.display === "none" ? "block" : "none"; });
      options.forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.theme)));
      document.addEventListener("click", e => { if (!e.target.closest(".theme-switcher")) panel.style.display = "none"; });
    })();

    // OTP input: digits only + auto-submit at 6
    const otpInput = document.getElementById('otp');
    otpInput.addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length === 6) this.form.submit();
    });
    otpInput.focus();

    // Resend OTP
    function resendOTP() {
      const email = document.getElementById('email').value;
      if (!email) { alert('Please enter your email address first.'); return; }
      const btn = document.getElementById('resend-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Sending...';
      fetch('/auth/resend-otp/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify({ email })
      })
      .then(r => r.json())
      .then(data => { alert(data.success ? 'New verification code sent!' : 'Error: ' + data.message); })
      .catch(() => { alert('Error sending code. Please try again.'); })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>Resend verification code';
      });
    }
  </script>
</body>
</html>
