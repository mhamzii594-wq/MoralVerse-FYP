<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login - MoralVerse.AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/professional.css' %}">
  <style>
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 10px 16px;
      background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
      color: #3c4043; font-weight: 500; font-size: 0.9rem;
      text-decoration: none; transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-google:hover { background: #f8f9fa; box-shadow: 0 1px 6px rgba(0,0,0,0.12); color: #3c4043; }
    .divider-text {
      display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;
      color: var(--text-muted); font-size: 0.8rem; font-weight: 500;
    }
    .divider-text::before, .divider-text::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  </style>
</head>
<body class="page-enter">
  <div class="min-vh-100 d-flex align-items-center" style="background:var(--bg-gradient);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card-pro">
            <div class="text-center mb-4">
              <div class="navbar-brand-pro mb-2" style="font-size:1.75rem;">
                <i class="bi bi-stars me-1"></i>MoralVerse.AI
              </div>
              <h2 class="mb-1" style="font-size:1.5rem;">Welcome Back</h2>
              <p class="text-muted-pro text-small">Login to access your stories and downloads</p>
            </div>

            {% if messages %}
              {% for message in messages %}
                <div class="alert-pro alert-pro--{{ message.tags }}">
                  <i class="alert-icon bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                  <div class="alert-body">{{ message }}</div>
                </div>
              {% endfor %}
            {% endif %}

            <!-- Google OAuth -->
            <a href="/accounts/google/login/?next=/home/" class="btn-google mb-3">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              </svg>
              Continue with Google
            </a>
            <div class="divider-text">or login with email</div>

            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label fw-semibold">Username or Email</label>
                <input type="text" name="username" class="input-pro" placeholder="Enter your username or email" required autofocus>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="input-pro" placeholder="Enter your password" required>
              </div>

              <button type="submit" class="btn btn-pro w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </button>
              
              <div class="text-center">
                <p class="text-muted small mb-2">
                  Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold">Sign Up</a>
                </p>
                <p class="text-muted small mb-0">
                  <a href="{% url 'admin_login' %}" class="text-decoration-none">Admin Login</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <div class="theme-switcher">
    <button class="theme-toggle-btn" id="theme-toggle-btn" type="button">
      <i class="bi bi-palette me-1"></i>Theme
    </button>
    <div class="theme-panel" id="theme-panel" style="display:none;">
      <button class="theme-option" data-theme="light"  type="button"><i class="bi bi-sun me-2"></i>Light</button>
      <button class="theme-option" data-theme="dark"   type="button"><i class="bi bi-moon me-2"></i>Dark</button>
      <button class="theme-option" data-theme="ocean"  type="button"><i class="bi bi-water me-2"></i>Ocean</button>
      <button class="theme-option" data-theme="sunset" type="button"><i class="bi bi-sunset me-2"></i>Sunset</button>
    </div>
  </div>
  <script>
    (function () {
      const root = document.documentElement;
      const saved = localStorage.getItem("mv_theme") || "light";
      const panel = document.getElementById("theme-panel");
      const toggle = document.getElementById("theme-toggle-btn");
      const options = document.querySelectorAll(".theme-option");

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("mv_theme", theme);
        options.forEach(btn => btn.classList.toggle("active", btn.dataset.theme === theme));
      }

      applyTheme(saved);
      toggle.addEventListener("click", () => {
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      });
      options.forEach(btn => btn.addEventListener("click", () => applyTheme(btn.dataset.theme)));
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".theme-switcher")) panel.style.display = "none";
      });
    })();
  </script>
</body>
</html>
